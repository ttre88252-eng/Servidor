<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Archivos — Consola</title>
<style>
  :root { --accent: #3AA6FF; --bg: #05070c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: #fff; height: 100vh; overflow: hidden;
  }
  #app { width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; }
  .bg-glow {
    position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 30% 15%, #151b2b 0%, #05070c 55%),
                radial-gradient(circle at 80% 70%, #10141f 0%, transparent 60%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  /* Asegura que el texto escrito siempre se vea, incluso si el navegador
     fuerza su propio modo oscuro/claro sobre los campos de formulario. */
  input, textarea, select {
    font-family: inherit; color: #fff; caret-color: #fff; color-scheme: dark;
  }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: #fff !important;
    transition: background-color 9999s ease-in-out 0s;
  }
  .hidden { display: none !important; }

  /* ---- Pantalla de selección de perfil ---- */
  .profile-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 24px; }
  .profile-title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.9; }
  .profile-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
  .profile-card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 96px; }
  .avatar-btn {
    width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;
    position: relative; transition: border-color .15s;
  }
  .avatar-btn:hover { border-color: rgba(255,255,255,0.4); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-btn .lock-badge {
    position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%;
    background: #111823; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
  }
  .profile-name { font-size: 12px; color: rgba(255,255,255,0.75); text-align: center; }
  .profile-del { font-size: 10px; color: rgba(255,80,80,0.6); }
  .new-profile .avatar-btn { border-style: dashed; }
  .create-panel {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 20px; width: 260px; display: flex; flex-direction: column; gap: 10px;
  }
  .create-panel input {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 8px 10px; color: #fff; font-size: 13px; outline: none;
  }
  .create-panel input:focus { border-color: rgba(255,255,255,0.4); }
  .btn-accent { background: var(--accent); color: #05070c; font-weight: 600; border-radius: 6px; padding: 8px; font-size: 12px; }
  .btn-ghost { background: rgba(255,255,255,0.08); border-radius: 6px; padding: 8px; font-size: 12px; }
  .row-gap { display: flex; gap: 8px; }

  /* ---- Modal PIN ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .pin-box { background: #10141f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 24px; width: 260px; text-align: center; }
  .pin-box input { width: 100%; text-align: center; letter-spacing: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 8px; font-size: 18px; color: #fff; outline: none; }
  .pin-error { color: #f87171; font-size: 11px; margin-top: 8px; }

  /* ---- Barra superior ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 12px; gap: 12px; }
  .user-chip { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .user-info { transition: max-width 0.2s ease, opacity 0.15s ease, margin 0.2s ease; max-width: 140px; opacity: 1; overflow: hidden; }
  .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .user-usage { font-size: 10px; color: rgba(255,255,255,0.3); white-space: nowrap; }
  .search-wrap { flex: 1; max-width: 420px; margin: 0 12px; position: relative; display: flex; align-items: center; transition: max-width 0.2s ease; }
  .search-wrap input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px 8px 32px; font-size: 12px; color: #fff; outline: none; transition: padding 0.18s ease, font-size 0.18s ease, background 0.18s ease, box-shadow 0.18s ease; position: relative; }
  .search-wrap input:focus { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); padding: 10px 12px 10px 32px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.4; pointer-events: none; }
  .top-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; transition: max-width 0.2s ease, opacity 0.15s ease, margin 0.2s ease; max-width: 160px; opacity: 1; overflow: hidden; }
  .topbar.searching .user-info { max-width: 0; opacity: 0; margin-left: -10px; }
  .topbar.searching .top-actions { max-width: 0; opacity: 0; margin-left: -14px; }
  .topbar.searching .search-wrap { max-width: none; }
  .upload-btn { display: flex; align-items: center; gap: 6px; background: var(--accent); color: #05070c; font-weight: 600; font-size: 12px; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
  .upload-btn:disabled { opacity: 0.5; }
  .icon-btn { color: rgba(255,255,255,0.6); }
  .icon-btn:hover { color: #fff; }

  /* ---- Chips de categoría ---- */
  .chips { display: flex; gap: 22px; padding: 0 24px 12px; overflow-x: auto; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
  .chip { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid transparent; color: rgba(255,255,255,0.5); white-space: nowrap; }
  .chip.active { border-color: var(--accent); color: #fff; }

  /* ---- Grid de archivos ---- */
  .grid-wrap { flex: 1; overflow-y: auto; padding: 0 24px 24px; }
  .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,0.3); }

  /* ---- Buscador web mezclado ---- */
  .web-results { padding: 4px 0 24px; }
  .web-results-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 10px; padding-top: 6px; }
  .web-results-label .line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
  .gcse-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px; min-height: 120px; }
  .web-setup { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; padding: 24px 16px; color: rgba(255,255,255,0.5); font-size: 12px; }
  .web-setup input { width: 100%; max-width: 320px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none; }
  .web-setup a { color: var(--accent); }
  .empty-state button { font-size: 12px; margin-top: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
  .tile-wrap { position: relative; }
  .tile { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: block; }
  .tile:hover { border-color: rgba(255,255,255,0.3); }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: rgba(255,255,255,0.85); }
  .tile-play-badge { position: absolute; bottom: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  .tile-del { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); opacity: 0; transition: opacity .15s; }
  .tile-wrap:hover .tile-del { opacity: 1; }
  .tile-del:hover { color: #f87171; }
  .file-name { font-size: 10px; margin-top: 4px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { font-size: 9px; color: rgba(255,255,255,0.3); }

  /* ---- Preview modal ---- */
  .preview-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .preview-box { max-width: 800px; max-height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .preview-head { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .preview-head span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-actions { display: flex; gap: 12px; flex-shrink: 0; }
  .preview-actions button, .preview-actions a { color: rgba(255,255,255,0.5); display: flex; align-items: center; }
  .preview-actions button:hover, .preview-actions a:hover { color: #fff; }
  .preview-box img, .preview-box video { max-height: 75vh; max-width: 100%; border-radius: 8px; }
  .pdf-frame { width: 100%; height: 75vh; border: none; border-radius: 8px; background: #fff; }
  .pdf-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; opacity: 0.85; }
  .doc-preview { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 0; color: rgba(255,255,255,0.5); }
  .doc-preview a { font-size: 12px; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); color: #fff; text-decoration: none; }
  .doc-preview a:hover { border-color: rgba(255,255,255,0.5); }
  .preview-actions button { display: flex; align-items: center; }

  /* ---- Editor de perfil ---- */
  .editor-box { background: #10141f; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 22px; width: 320px; max-height: 85vh; overflow-y: auto; }
  .editor-box h3 { margin: 0 0 16px; font-size: 15px; }
  .field-label { font-size: 11px; color: rgba(255,255,255,0.5); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .field-label:first-of-type { margin-top: 0; }
  .editor-box input[type=text], .editor-box input[type=password], .editor-box select {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 8px 10px; color: #fff; font-size: 13px; outline: none;
  }
  .editor-box input:focus, .editor-box select:focus { border-color: rgba(255,255,255,0.4); }
  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.active { border-color: #fff; }
  .avatar-edit-row { display: flex; align-items: center; gap: 12px; }
  .avatar-edit-preview { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .avatar-edit-preview img { width: 100%; height: 100%; object-fit: cover; }
  .editor-error { color: #f87171; font-size: 11px; margin-top: 8px; min-height: 14px; }
  .editor-success { color: #4ade80; font-size: 11px; margin-top: 8px; min-height: 14px; }
  .danger-link { color: rgba(248,113,113,0.7); font-size: 11px; margin-top: 18px; display: block; text-align: center; }
  .danger-link:hover { color: #f87171; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>
<div id="app"><div class="bg-glow"></div></div>

<script>
const ACCENT = "#3AA6FF";
const KIND_LABEL = { foto: "Fotos", video: "Videos", audio: "Audio", documento: "Documentos" };

const BG_PRESETS = {
  azul:    "radial-gradient(circle at 30% 15%, #151b2b 0%, #05070c 55%), radial-gradient(circle at 80% 70%, #10141f 0%, transparent 60%)",
  morado:  "radial-gradient(circle at 30% 15%, #241b33 0%, #0a0512 55%), radial-gradient(circle at 80% 70%, #1a0f24 0%, transparent 60%)",
  verde:   "radial-gradient(circle at 30% 15%, #142b1e 0%, #05100a 55%), radial-gradient(circle at 80% 70%, #0f1f15 0%, transparent 60%)",
  rojo:    "radial-gradient(circle at 30% 15%, #2b1717 0%, #100505 55%), radial-gradient(circle at 80% 70%, #1f0f0f 0%, transparent 60%)",
  negro:   "radial-gradient(circle at 30% 15%, #1a1a1a 0%, #000 55%), radial-gradient(circle at 80% 70%, #111 0%, transparent 60%)",
};
const FONT_PRESETS = {
  sistema: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  monoespaciada: "'Courier New', ui-monospace, monospace",
  serif: "Georgia, 'Times New Roman', serif",
  redondeada: "'Trebuchet MS', Verdana, sans-serif",
};

// ---- iconos SVG (offline, sin dependencias externas) ----
const ICONS = {
  user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>',
  lock: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
  upload: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  logout: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  layers: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
  image: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  video: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-4v12l-6-4"/></svg>',
  file: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>',
  play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  trash: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  music: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  external: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
  settings: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
};
const KIND_ICON = { foto: ICONS.image, video: ICONS.video, audio: ICONS.music, documento: ICONS.file };

// ---- estado ----
let state = { me: null, users: [], files: [], activeKind: "all", query: "", preview: null, uploading: false, pinTarget: null, googleCx: "", showWebResults: false, webSearchDebounce: null };
// Miniaturas generadas en el cliente para video/audio: fileId -> dataURL/blobURL | "none" (sin miniatura) | null (en curso)
const thumbCache = new Map();
const TILE_COLORS = ["#F97316", "#EF4444", "#EC4899", "#8B5CF6", "#6366F1", "#3B82F6", "#06B6D4", "#10B981", "#84CC16", "#F59E0B", "#14B8A6", "#A855F7"];
function colorForFile(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  return TILE_COLORS[hash % TILE_COLORS.length];
}

function isPdf(f) {
  return f.mime === "application/pdf" || /\.pdf$/i.test(f.name);
}

function fmtBytes(n) {
  if (!n) return "0 KB";
  const u = ["B","KB","MB","GB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + " " + u[i];
}

async function api(url, opts = {}) {
  const res = await fetch(url, { credentials: "include", headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || "Error de red"); }
  return res.status === 204 ? null : res.json();
}

async function loadUsers() { state.users = await api("/api/users"); }
async function loadFiles() { state.files = await api("/api/files"); }
async function loadSearchSettings() {
  try {
    const s = await api("/api/search-settings");
    state.googleCx = s.googleCx || "";
  } catch { state.googleCx = ""; }
}

async function init() {
  // Por seguridad: cada vez que se abre o recarga la página se cierra
  // cualquier sesión anterior, para que SIEMPRE pida perfil + PIN de nuevo.
  // Antes, la cookie de sesión (válida hasta 30 días) hacía que /api/me
  // funcionara solo y el perfil se quedara abierto sin pedir PIN otra vez.
  await api("/api/logout", { method: "POST" }).catch(() => {});
  await loadUsers();
  state.me = null;
  render();
}

function applyTheme(theme) {
  if (!theme) return;
  document.querySelector(".bg-glow") && (document.querySelector(".bg-glow").style.background = BG_PRESETS[theme.bg] || BG_PRESETS.azul);
  document.body.style.fontFamily = FONT_PRESETS[theme.font] || FONT_PRESETS.sistema;
  document.documentElement.style.setProperty("--accent", theme.accent || ACCENT);
}

// ---- acciones ----
async function afterLogin(me) {
  state.me = me;
  await Promise.all([loadFiles(), loadSearchSettings()]);
  render();
}

async function selectUser(u) {
  if (u.hasPin) { state.pinTarget = u; render(); return; }
  const me = await api("/api/login", { method: "POST", body: JSON.stringify({ userId: u.id }) });
  await afterLogin(me);
}

async function confirmPin() {
  const val = document.getElementById("pin-input").value;
  try {
    const me = await api("/api/login", { method: "POST", body: JSON.stringify({ userId: state.pinTarget.id, pin: val }) });
    state.pinTarget = null;
    await afterLogin(me);
  } catch (e) {
    document.getElementById("pin-error").textContent = e.message;
  }
}

async function createUser() {
  const errEl = document.getElementById("create-error");
  const name = document.getElementById("new-name").value.trim();
  const pin = document.getElementById("new-pin").value.trim();
  errEl.textContent = "";
  if (!name) { errEl.textContent = "Escribe un nombre"; return; }
  if (!/^\d{4}$/.test(pin)) { errEl.textContent = "El PIN debe tener exactamente 4 cifras"; return; }
  try {
    const u = await api("/api/users", { method: "POST", body: JSON.stringify({ name, pin }) });
    state.users.push(u);
    document.getElementById("new-name").value = ""; document.getElementById("new-pin").value = "";
    state.creating = false; render();
  } catch (e) { errEl.textContent = e.message; }
}

async function deleteUserAccount() {
  if (!confirm("¿Borrar tu cuenta y todos tus archivos? Esta acción no se puede deshacer.")) return;
  await api("/api/users/" + state.me.id, { method: "DELETE" });
  state.me = null; state.files = [];
  await loadUsers(); render();
}

async function logout() {
  await api("/api/logout", { method: "POST" });
  state.me = null; state.files = []; state.activeKind = "all"; state.query = ""; state.showWebResults = false;
  render();
}

async function handleUpload(fileList) {
  state.uploading = true; render();
  const form = new FormData();
  for (const f of fileList) form.append("files", f);
  try {
    const res = await fetch("/api/upload", { method: "POST", credentials: "include", body: form });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `El servidor respondió con error ${res.status}`);
    }
    await loadFiles();
  } catch (e) { alert("Error al subir: " + e.message); }
  state.uploading = false; render();
}

async function removeFile(id) {
  await api("/api/files/" + id, { method: "DELETE" });
  state.files = state.files.filter(f => f.id !== id);
  if (state.preview && state.preview.id === id) state.preview = null;
  render();
}

// ---- render ----
function render() {
  const app = document.getElementById("app");
  if (!state.me) { renderProfileScreen(app); return; }
  renderBrowser(app);
}

function visibleFiles() {
  let list = state.files;
  if (state.activeKind !== "all") list = list.filter(f => f.kind === state.activeKind);
  if (state.query.trim()) {
    const q = state.query.toLowerCase();
    list = list.filter(f => f.name.toLowerCase().includes(q));
  }
  return list;
}

function counts() {
  const c = { foto: 0, video: 0, audio: 0, documento: 0 };
  state.files.forEach(f => c[f.kind] = (c[f.kind] || 0) + 1);
  return c;
}

  document.getElementById("search-input").oninput = (e) => {

    renderGridOnly();
    clearTimeout(state.webSearchDebounce);
    state.webSearchDebounce = setTimeout(() => {
      const noFileMatches = state.query.trim().length >= 2 && visibleFiles().length === 0;
      if (state.showWebResults !== noFileMatches) {
        state.showWebResults = noFileMatches;
        renderGridOnly();
      } else if (noFileMatches) {
        runWebSearch(state.query.trim());

    }, 500);
  };
  document.getElementById("search-input").onfocus = () => {

    chip.onclick = () => { state.activeKind = chip.dataset.kind; render(); };

  // "Documentos") haya quedado seleccionado fuera de la vista.
  document.querySelector(".chip.active")?.scrollIntoView({ inline: "nearest", block: "nearest" });

  renderGridInto(document.getElementById("grid-wrap"), vf);
  if (state.preview) renderPreview(app);
  if (state.editingProfile) renderProfileEditor(app);

function renderGridOnly() {
  renderGridInto(document.getElementById("grid-wrap"), visibleFiles());
}

function renderGridInto(wrap, vf) {
  const hasQuery = state.query.trim().length >= 2;

  if (vf.length === 0) {
    const showWeb = hasQuery && state.showWebResults;
    const emptyStateKey = `${hasQuery ? 1 : 0}:${showWeb ? 1 : 0}`;
    if (wrap.dataset.emptyStateKey === emptyStateKey) {
      // Ya estamos mostrando este mismo estado (sin coincidencias, con o sin
      // resultados web) — no reconstruir el DOM o se destruye el widget de
      // Google a medio cargar. Solo la búsqueda debounced (runWebSearch) debe
      // actualizar el contenido cuando cambia el texto.
      return;
    }
    wrap.dataset.emptyStateKey = emptyStateKey;
    wrap.innerHTML = `
      <div class="empty-state" style="height:${showWeb ? "auto" : "100%"};padding:${hasQuery ? "30px 0 10px" : "0"};">
        ${ICONS.upload}
        <span style="font-size:13px;">${hasQuery ? "Ningún archivo coincide con tu búsqueda" : "No hay archivos aquí todavía"}</span>
        ${!hasQuery ? `<button id="empty-upload-btn">Subir archivos</button>` : ""}
      </div>
      ${showWeb ? webResultsSection() : ""}
    `;
    if (!hasQuery) document.getElementById("empty-upload-btn").onclick = () => document.getElementById("file-input").click();
    if (showWeb) mountWebResults(state.query.trim());
    return;
  }
  wrap.dataset.emptyStateKey = "";
  const grid = document.createElement("div");
  grid.className = "file-grid";
  vf.forEach(f => grid.appendChild(fileTile(f)));
  wrap.innerHTML = "";
  wrap.appendChild(grid);
}

function webResultsSection() {
  return `
    <div class="web-results">
      <div class="web-results-label"><span class="line"></span>RESULTADOS WEB<span class="line"></span></div>
      <div class="gcse-box" id="gcse-container"></div>
    </div>
  `;
}

let gcseScriptLoaded = false;
let gcseReady = false;
let pendingWebQuery = null;
let cseSearchElement = null; // referencia persistente al widget ya dibujado, para no volver a "render()" cada vez

function mountWebResults(query) {
  const container = document.getElementById("gcse-container");
  if (!container) return;

  if (!state.googleCx) {
    container.innerHTML = `
      <div class="web-setup">
        <div>Aún no configuras el buscador web. Pega aquí tu ID de Google Programmable Search Engine (cx):</div>
        <input id="cx-input" placeholder="Ej: a1b2c3d4e5f6g7h8i" />
        <button class="btn-accent" id="cx-save-btn" style="padding:8px 16px;">Guardar</button>
        <a href="https://programmablesearchengine.google.com/controlpanel/create" target="_blank" rel="noopener">Crear uno gratis en Google →</a>
      </div>
    `;
    document.getElementById("cx-save-btn").onclick = async () => {
      const cx = document.getElementById("cx-input").value.trim();
      if (!cx) return;
      await api("/api/search-settings", { method: "PUT", body: JSON.stringify({ googleCx: cx }) });
      state.googleCx = cx;
      renderGridOnly();
    };
    return;
  }

  // Este contenedor es nuevo en el DOM (se acaba de crear) — cualquier
  // referencia al widget anterior ya no sirve, hay que dibujarlo de cero.
  container.innerHTML = `<div class="gcse-searchresults-only" id="gcse-el"></div>`;
  cseSearchElement = null;
  runWebSearch(query);
}

function runWebSearch(query) {
  pendingWebQuery = query;
  if (!gcseScriptLoaded) {
    gcseScriptLoaded = true;
    window.__gcse = {
      parsetags: "explicit",
      callback: () => {
        gcseReady = true;
        renderWebSearchElement();
      },
    };
    const s = document.createElement("script");
    s.src = "https://cse.google.com/cse.js?cx=" + encodeURIComponent(state.googleCx);
    s.async = true;
    document.head.appendChild(s);
  } else if (gcseReady) {
    renderWebSearchElement();
  }
}

function renderWebSearchElement() {
  if (!window.google || !google.search || !pendingWebQuery) return;
  const el = document.getElementById("gcse-el");
  if (!el) return;

  if (cseSearchElement) {
    // El widget ya está dibujado en este mismo contenedor — solo pedirle la
    // nueva búsqueda, sin volver a "render()" (eso es lo que dejaba el
    // recuadro en blanco al escribir rápido).
    cseSearchElement.execute(pendingWebQuery);
    return;
  }

  google.search.cse.element.render({ div: "gcse-el", tag: "searchresults-only" });
  cseSearchElement = google.search.cse.element.getElement("searchresults-only0");
  if (cseSearchElement) cseSearchElement.execute(pendingWebQuery);
}

function fileTile(f) {
  const div = document.createElement("div");
  div.className = "tile-wrap";
  const bg = colorForFile(f.id);
  const cachedThumb = thumbCache.get(f.id);
  const hasThumb = cachedThumb && cachedThumb !== "none";

  let inner;
  if (f.kind === "foto") {
    inner = `<img src="/api/files/${f.id}/raw" loading="lazy" alt="${escapeHtml(f.name)}" />`;
  } else if (f.kind === "video") {
    inner = hasThumb
      ? `<img src="${cachedThumb}" alt="${escapeHtml(f.name)}" /><span class="tile-play-badge">${ICONS.play}</span>`
      : `<div class="tile-placeholder" style="background:${bg}">${ICONS.video}</div>`;
  } else if (f.kind === "audio") {
    inner = hasThumb
      ? `<img src="${cachedThumb}" alt="${escapeHtml(f.name)}" />`
      : `<div class="tile-placeholder" style="background:${bg}">${ICONS.music}</div>`;
  } else if (isPdf(f)) {
    inner = `<div class="tile-placeholder" style="background:${bg}">${ICONS.file}<span class="pdf-badge">PDF</span></div>`;
  } else {
    inner = `<div class="tile-placeholder" style="background:${bg}">${ICONS.file}</div>`;
  }

  div.innerHTML = `
    <button class="tile" data-id="${f.id}">${inner}</button>
    <button class="tile-del" data-id="${f.id}">${ICONS.trash}</button>
    <div class="file-name">${escapeHtml(f.name)}</div>
    <div class="file-size">${fmtBytes(f.size)}</div>
  `;
  div.querySelector(".tile").onclick = () => { state.preview = f; render(); };
  div.querySelector(".tile-del").onclick = (e) => { e.stopPropagation(); removeFile(f.id); };

  // Generar la miniatura real en segundo plano (una sola vez por archivo)
  // y refrescar solo la cuadrícula cuando esté lista, como en una galería.
  if (f.kind === "video" && !thumbCache.has(f.id)) {
    thumbCache.set(f.id, null);
    generateVideoThumbnail(`/api/files/${f.id}/raw`).then(url => {
      thumbCache.set(f.id, url || "none");
      if (url) renderGridOnly();
    });
  }
  if (f.kind === "audio" && !thumbCache.has(f.id)) {
    thumbCache.set(f.id, null);
    getAudioCoverDataUrl(f.id).then(url => {
      thumbCache.set(f.id, url || "none");
      if (url) renderGridOnly();
    });
  }

  return div;
}

// ---- miniatura de video: toma el primer fotograma con un <video> oculto ----
function generateVideoThumbnail(url) {
  return new Promise((resolve) => {
    let settled = false;
    const video = document.createElement("video");
    video.preload = "metadata";
    video.muted = true;
    video.playsInline = true;
    const timeout = setTimeout(() => finish(null), 8000);
    function cleanup() {
      clearTimeout(timeout);
      video.removeAttribute("src");
      try { video.load(); } catch (e) {}
    }
    function finish(val) {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(val);
    }
    video.addEventListener("loadedmetadata", () => {
      try { video.currentTime = Math.min(1, (video.duration || 2) * 0.1) || 0.1; }
      catch (e) { finish(null); }
    });
    video.addEventListener("seeked", () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 180;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        finish(canvas.toDataURL("image/jpeg", 0.75));
      } catch (e) { finish(null); }
    });
    video.addEventListener("error", () => finish(null));
    video.src = url;
  });
}

// ---- miniatura de audio: portada embebida en las etiquetas ID3 (MP3) ----
async function getAudioCoverDataUrl(fileId) {
  try {
    const res = await fetch(`/api/files/${fileId}/raw`, {
      credentials: "include",
      headers: { Range: "bytes=0-1048575" },
    });
    if (!res.ok && res.status !== 206) return null;
    const buf = new Uint8Array(await res.arrayBuffer());
    return extractId3Cover(buf);
  } catch (e) { return null; }
}

function extractId3Cover(buf) {
  if (buf.length < 10 || !(buf[0] === 0x49 && buf[1] === 0x44 && buf[2] === 0x33)) return null; // "ID3"
  const ver = buf[3];
  const flags = buf[5];
  const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) | ((buf[8] & 0x7f) << 7) | (buf[9] & 0x7f);
  let offset = 10;
  if (flags & 0x40) {
    const b = offset;
    const extSize = ver >= 4
      ? ((buf[b] & 0x7f) << 21) | ((buf[b+1] & 0x7f) << 14) | ((buf[b+2] & 0x7f) << 7) | (buf[b+3] & 0x7f)
      : (buf[b] << 24) | (buf[b+1] << 16) | (buf[b+2] << 8) | buf[b+3];
    offset += extSize;
  }
  const end = Math.min(buf.length, 10 + size);
  while (offset < end - 10) {
    const frameId = String.fromCharCode(buf[offset], buf[offset+1], buf[offset+2], buf[offset+3]);
    if (!/^[A-Z0-9]{4}$/.test(frameId)) break;
    const frameSize = ver >= 4
      ? ((buf[offset+4] & 0x7f) << 21) | ((buf[offset+5] & 0x7f) << 14) | ((buf[offset+6] & 0x7f) << 7) | (buf[offset+7] & 0x7f)
      : (buf[offset+4] << 24) | (buf[offset+5] << 16) | (buf[offset+6] << 8) | buf[offset+7];
    const frameStart = offset + 10;
    if (frameSize <= 0 || frameStart + frameSize > buf.length) break;
    if (frameId === "APIC") {
      let p = frameStart;
      const textEncoding = buf[p]; p += 1;
      let mimeEnd = p;
      while (mimeEnd < frameStart + frameSize && buf[mimeEnd] !== 0) mimeEnd++;
      const mime = String.fromCharCode(...buf.subarray(p, mimeEnd)) || "image/jpeg";
      p = mimeEnd + 1;
      p += 1; // byte de tipo de imagen
      if (textEncoding === 1 || textEncoding === 2) {
        while (p < frameStart + frameSize - 1 && !(buf[p] === 0 && buf[p+1] === 0)) p += 2;
        p += 2;
      } else {
        while (p < frameStart + frameSize && buf[p] !== 0) p++;
        p += 1;
      }
      const imgData = buf.subarray(p, frameStart + frameSize);
      if (imgData.length < 10) return null;
      return URL.createObjectURL(new Blob([imgData], { type: mime }));
    }
    offset = frameStart + frameSize;
  }
  return null;
}

function resizeImageToDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      <div class="field-label">Color de acento</div>
      <input type="text" id="edit-accent" value="${theme.accent}" style="width:100%;height:34px;padding:2px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:transparent;" />
      <input type="color" id="edit-accent-picker" value="${theme.accent}" style="width:100%;height:34px;margin-top:6px;border:none;background:none;" />

      <div class="field-label">Tipo de letra</div>
      <select id="edit-font">
        ${Object.keys(FONT_PRESETS).map(f => `<option value="${f}" ${theme.font === f ? "selected" : ""}>${f[0].toUpperCase()+f.slice(1)}</option>`).join("")}
      </select>

      <div class="field-label">Cambiar PIN</div>
      ${state.me.hasPin ? `<input type="password" id="edit-current-pin" placeholder="PIN actual" inputmode="numeric" maxlength="4" style="margin-bottom:8px;" />` : ""}
      <input type="password" id="edit-new-pin" placeholder="PIN nuevo de 4 cifras (déjalo vacío para no cambiarlo)" inputmode="numeric" maxlength="4" />

      <div class="editor-error" id="editor-error"></div>
      <div class="editor-success" id="editor-success"></div>

      <div class="row-gap" style="margin-top:16px;">
        <button class="btn-accent" id="save-profile-btn" style="flex:1">Guardar</button>
        <button class="btn-ghost" id="cancel-profile-btn">Cancelar</button>
      </div>
      <button class="danger-link" id="delete-account-btn">Borrar mi cuenta y mis archivos</button>
    </div>
  `;
  app.appendChild(overlay);

  document.getElementById("avatar-pick-btn").onclick = () => document.getElementById("avatar-input").click();
  document.getElementById("avatar-input").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    draftAvatar = await resizeImageToDataUrl(file);
    document.getElementById("avatar-preview").innerHTML = `<img src="${draftAvatar}" />`;
  };
  document.querySelectorAll("#bg-swatches .swatch").forEach(sw => {
    sw.onclick = () => {
      document.querySelectorAll("#bg-swatches .swatch").forEach(s => s.classList.remove("active"));
      sw.classList.add("active");
    };
  });
  const accentText = document.getElementById("edit-accent");
  const accentPicker = document.getElementById("edit-accent-picker");
  accentPicker.oninput = () => { accentText.value = accentPicker.value; };
  accentText.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(accentText.value)) accentPicker.value = accentText.value; };

  document.getElementById("cancel-profile-btn").onclick = () => { state.editingProfile = false; render(); };
  document.getElementById("delete-account-btn").onclick = deleteUserAccount;
  document.getElementById("save-profile-btn").onclick = async () => {
    const errEl = document.getElementById("editor-error");
    const okEl = document.getElementById("editor-success");
    errEl.textContent = ""; okEl.textContent = "";
    const activeSwatch = document.querySelector("#bg-swatches .swatch.active");
    const body = {
      name: document.getElementById("edit-name").value,
      avatar: draftAvatar,
      theme: {
        bg: activeSwatch ? activeSwatch.dataset.bg : theme.bg,
        accent: accentText.value,
        font: document.getElementById("edit-font").value,
      },
    };
    const newPin = document.getElementById("edit-new-pin").value;
    if (newPin !== "") {
      if (!/^\d{4}$/.test(newPin)) { errEl.textContent = "El PIN debe tener exactamente 4 cifras"; return; }
      body.newPin = newPin;
      if (state.me.hasPin) body.currentPin = document.getElementById("edit-current-pin") ? document.getElementById("edit-current-pin").value : "";
    }

    try {
      state.me = await api("/api/me", { method: "PUT", body: JSON.stringify(body) });
      okEl.textContent = "Guardado ✓";
      applyTheme(state.me.theme);
      setTimeout(() => { state.editingProfile = false; render(); }, 500);
    } catch (e) {
      errEl.textContent = e.message;
    }
  };
}

function renderPreview(app) {
  const f = state.preview;
  const overlay = document.createElement("div");
  overlay.className = "preview-overlay";
  overlay.onclick = () => { state.preview = null; render(); };
  let media = "";
  if (f.kind === "foto") {
    media = `<img src="/api/files/${f.id}/raw" alt="${escapeHtml(f.name)}" />`;
  } else if (f.kind === "video") {
    media = `<video src="/api/files/${f.id}/raw" controls autoplay></video>`;
  } else if (f.kind === "audio") {
    media = `<div class="doc-preview">${ICONS.music}<audio src="/api/files/${f.id}/raw" controls autoplay style="width:280px;"></audio></div>`;
  } else if (isPdf(f)) {
    media = `<iframe class="pdf-frame" src="/api/files/${f.id}/raw" title="${escapeHtml(f.name)}"></iframe>`;
  } else {
    media = `
      <div class="doc-preview">
        ${ICONS.file}
        <span style="font-size:11px;opacity:0.6;">Vista previa no disponible para este tipo de archivo — descárgalo para abrirlo.</span>
      </div>`;
  }

  overlay.innerHTML = `
    <div class="preview-box">
      <div class="preview-head">
        <span>${escapeHtml(f.name)}</span>
        <div class="preview-actions">
          ${isPdf(f) ? `<a href="/api/files/${f.id}/raw" target="_blank" rel="noopener" title="Abrir en pestaña nueva">${ICONS.external}</a>` : ""}
          <a href="/api/files/${f.id}/download" title="Descargar">${ICONS.download}</a>
          <button id="preview-del" title="Borrar">${ICONS.trash}</button>
          <button id="preview-close" title="Cerrar">${ICONS.x}</button>
        </div>
      </div>
      ${media}
    </div>
  `;
  overlay.querySelector(".preview-box").onclick = (e) => e.stopPropagation();
  app.appendChild(overlay);
  document.getElementById("preview-del").onclick = () => removeFile(f.id);
  document.getElementById("preview-close").onclick = () => { state.preview = null; render(); };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

init();
</script>
</body>
</html>
